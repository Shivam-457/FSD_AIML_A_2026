<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shivam form</title>
</head>
<body>
    <h1>Welcome to CodeHelp</h1>
    <h1>Contact Us Form</h1>
    <form action="/htmlday2.html">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter Your Name">
        <br>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your Email">
        <br>
        <label for="mobileno" >Contact Number</label>
        <input type="number" id="mobileno" placeholder="Enter Contact Number">
        <br>
        <label for="gender">Gender</label>
        <select id="gender">
            <option>Male</option>
            <option>Female</option>
            <option>Transgender</option>
        </select>
        <br>
        <label for="Dateofbirth">Date Of Birth</label>
        <input type="date" id="Dateofbirth">
        <br>
        <label for="Rating">Rating</label>
        <input type="radio" name="rating" value="1">1
        <input type="radio" name="rating" value="2">2
        <input type="radio" name="rating" value="3">3
        <input type="radio" name="rating" value="4">4
        <input type="radio" name="rating" value="5">5
        <br>
        <label for="message">Message</label>
        <br>
        <textarea id="message" rows="5" cols="40" placeholder="Enter Your Message"></textarea>
        <br> 
        <input type="button" value="Send">
        <input type="button" value="Reset">
    </form>
