<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Fetch</title>

    <style>
        h1{
            margin: auto;
            text-align: center;
        }
        table {
            border: 2px solid blue;
            width: 80vw;
            border-collapse: collapse;
            margin: auto;
        }

        th, td {
            border: 2px solid black;
            text-align: center;
            padding: 8px;
        }

        th {
            background-color: lightblue;
        }

        td img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <table>
        <caption>List of Products</caption>

        <thead>
            <tr>
                <th>S.No.</th>
                <th>Title</th>
                <th>Image</th>
                <th>Category</th>
                <th>Rating</th>
                <th>Price</th>
                <th>Stock</th>
            </tr>
        </thead>

        <tbody id="data">
        </tbody>

    </table>

    <script>
        const URL = "https://dummyjson.com/products?limit=100&skip=5";

        async function loadProducts() {
            try {
                const res = await fetch(URL);

                console.log(res);

                const data = await res.json();

                console.log("data:", data.products);

                let rows = "";

                data.products.forEach((i, index) => {
                    rows += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${i.title}</td>
                            <td>
                                <img src="${i.images[0]}" alt="${i.title}">
                            </td>
                            <td>${i.category}</td>
                            <td>${i.rating}</td>
                            <td>₹${i.price}</td>
                            <td>${i.stock}</td>
                        </tr>
                    `;
                });

                const el = document.getElementById("data");

                el.innerHTML = rows;

            } catch (err) {
                console.log("Error:", err);
            }
        }

        loadProducts();
    </script>

</body>
</html>
