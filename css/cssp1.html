<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            font-size: 100px;
            border-radius: 100px;
            padding: 50px;
            margin:20px;
            background-color: aqua;
            border: 10px solid black;
            cursor: pointer;
        }
        p{
            font-size: 50px;
            background-color: beige;
            color: #26f30b;
            text-decoration: underline;
        }
        .new{
            height: 100px;
        }
        #hi{
            color:bisque;
        }
        table{
             border:10px solid black;
        }
        .hi{
            font-size: small;
        }
        .bye{
            font-size: large;
        }
        /* y pseudo class selector h  */
        button:hover{
            color:blue
        }
        
    </style>
</head>
<body>
    <p>This ia a page of css practicing</p>
    <button background-color: red; color: #26f30b; font-size:30px; margin:20px; border-radius:50px; height:50px">  <!--inline css-->
        click me
    </button>
    <button class="new">don't click me</button>
    <button id="hi">reset</button>
    <!-- inline>id>class>internal -->

    <table>
        <thead>
        <tr>
            <td>1</td>
            <td>2</td>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>3</td>
            <td>4</td>
        </tr>
        <tr>
            <td>5</td>
            <td>6</td>
        </tr>
        <tr>
            <td>7</td>
            <td>8</td>
        </tr>
        </tbody>

    </table>
    <h1 class="hi">Hello</h1>
    <h2 class="hi">Hi</h2>
    <h3 class="hi">ky</h3>
    <h4 class="bye">Bye</h4>
    <h5 class="bye">baad m</h5>
    <h6 class="bye">ok</h6>
    <button>
        Click for pdf

    </button>
</body>
</html>
