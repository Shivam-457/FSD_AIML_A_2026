<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Grid</title>
    <style>
        .container{
            border: 1px solid black;
            height: 600px;
            width: 600px;
            background-color: yellow;
            grid-template-rows: 30px 1fr 30px;
            grid-template-columns: 150px 1fr;
            display: grid;
            gap: 4px;
            grid-template-areas:
            "hd hd"
            "sd ct"
            "ft ft";
        }
        .box{
            background-color: aqua;
            border: 1px solid black;
        }
        #hd{
            grid-area:hd;
        }
        #ft{
            grid-area: ft;
        }
        #sd{
            grid-area: sd;
        }
        #ct{
            grid-area:ct;
        }
        .childgrid{
            height: 100%;
            width: 100%;
            display: grid;
            grid-template-rows: repeat(2,1fr);
            grid-template-columns: repeat(2,1fr);
            grid-gap: 5px;
        }
        .element{
            border: 2px solid green;
            background-color: hotpink;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="hd">Header
        </div>
        <div class="box" id="sd">Sidebar</div>
        <div class="box" id="ct">
            <div class="childgrid">
                <div class="element">Img1</div>
                <div class="element">Img2</div>
                <div class="element">Img3</div>
                <div class="element">Img4</div>
            </div>
        </div>
        <div class="box" id="ft">Footer</div>
    </div>
</body>
</html>
