<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables</title>
    <style>
        :root{
            --dark-red:#981a2c; /*iska scope global hai yha pr hum isse khe bhi use kr skte hai*/
        }
        .container{
            border: 1px solid brown;
            background-color: red;
            height: 300px;
        }
        .box{
            border: 2px solid green;
            background-color: aqua;
            --dark-red:#981a2c;/* iska scope local hai sirf box k ander hi use kr skte hum*/
            color:var(--dark-red);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Box1</div>
        <div class="box">Box2</div>
        <div class="box">Box3</div>
        <div class="box">Box4</div>
    </div>
</body>
</html>
