<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 700px;
            border: 1px solid red;
            background-color: yellow;
            display: grid; /*grid m convert ho jate isse*/
            grid-template-rows: repeat(4,1fr);
            grid-template-columns: repeat(3,1fr);
            grid-gap: 10px;
            grid-auto-rows: minmax(100px,auto);  /*min 100px k rhege max kitne bhi ho skte*/
        }
        .box{
            border: 1px solid green;
            background-color: aqua;
            /* height: 100px;
            width: 100px; */
        }
        #A{
            /* grid-column-start: 1;
            grid-column-end: 4; */
            /* grid-column: 1/span 3; */

            /*multiple row and column m krna hain to*/
            /* grid-row-start: 1;
            grid-row-end: 3;
            grid-column-start: 1;
            grid-column-end: 4; */
            
            /* grid-area: 1/1/3/4;  short m use krne k liye jab col and row dono m box ka size increase krna ho */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="A">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </div>
</body>
</html>
