<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Button</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container
        {
            width: 100vw;
            height: 100vh;
            overflow-x:hidden;
            overflow-y: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            padding: 0.8rem 2.3rem;
            background-color: #e84949; 
            color: white;
            font-size: 18px;
            box-shadow: 5px 5px 7px 0px #000000 ;
            position: relative;
            z-index: 1;
        }
        .box::before
        {
            content: "";
            background-color: #1f1f1f;
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            transform: ScaleX(0);
            transform-origin: left;
            transition: all 1s;
            z-index: -1;
        }
        .box:hover::before{
            transform: ScaleX(1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Hire me</div>
    </div>
</body>
</html>
