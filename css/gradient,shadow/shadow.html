<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            text-shadow:3px 3px 3px;
        }
        h2{
            text-shadow: 3px 3px 3px red,5px 5px 5px green;
        }
        h3{
            text-shadow: 3px 3px 3px red,60px 60px 6px rgb(172, 207, 15);
        }
        .hi{
            border:1px solid black;
            margin: 90px;
            width: 500px;
            height: 500px;
            background-color: yellow;
            box-shadow: 20px 20px 20px red,25px 25px 25px green;
        }
        .h{
            border:1px solid black;
            margin:20px;
            width:500px;
            height: 500px;
            background-color: orange;
            box-shadow: 15px 15px 15px red,-20px -20px 20px green;
        }
        .j{
            border:1px solid black;
            margin:20px;
            width:500px;
            height: 500px;
            background-color: orange;
            box-shadow:0 0 0 10px black;
        }
    </style>
</head>
<body>
    <h1>This is shadow page</h1>
    <h2>This is another shadow page</h2>
    <h3>practice</h3>
    <div class="hi"></div>
    <div class="h"></div>
    <div class="j"></div>
</body>
</html>
