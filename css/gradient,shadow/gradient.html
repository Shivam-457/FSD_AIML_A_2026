<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #new{
            width:500px;
            height: 500px;
            background-image: linear-gradient(red,blue);
            border:1px solid black;
            background-image: linear-gradient(to right,red,blue);
            background-image: linear-gradient(to left,red,blue);
            background-image: linear-gradient(to bottom,red,blue);
            background-image: linear-gradient(to top,red,blue);
            background-image: linear-gradient(to bottom right,red,blue);
            background-image: linear-gradient(to bottom left,red,blue);
            background-image: linear-gradient(to top right,red,blue);
            background-image: linear-gradient(to bottom right ,orange,white,green);
            background-image: linear-gradient(275deg,orange,white,green);
            background-image:linear-gradient(to bottom,rgba(0,0,255,0),rgba(0,0,255,1));

        }
        #hi{
            margin:10px;
            border:1px solid black;
            width: 500px;
            height:500px;
            background-image: radial-gradient(orange,white,green);
            background-image: radial-gradient(yellow 5%,red 10%,orange 50%);
        }
        #h{
            margin: 20px;
            width: 400px;
            height: 200px;
            border: 1px solid black;
            background-image: radial-gradient(circle,rgba(166, 163, 166, 0),rgba(24, 144, 132, 0.5),rgb(167, 238, 25));  /*y rectangle box m tha and cjo circle h vo elliptical m aa rha tha humne circle m kar diya */
        }
        #l{
            margin:20px;
            height:500px;
            width:500px;
            border:1px solid black;
            background-image: conic-gradient(orange ,white,green);
            background-image: conic-gradient(from 45deg,red,green,blue);
            background-image: conic-gradient(at bottom,green,yellow,pink);
            background-image: conic-gradient(at bottom right,yellow,blue,red);
            /*background-image: conic-gradient(orange 0deg 120deg,white 120deg 240deg,green 240deg 360deg); */

        }   
    </style>
</head>
<body>
    <div id="new"></div>

    <div id="hi"></div>
    <div id="h"></div>
    <div id="l"></div>

    <!--text shadow-->
</body>
</html>
