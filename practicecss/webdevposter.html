<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Card</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background-color:#f2f2f2;
}

.container{
    display:flex;
    justify-content:center;
    margin-top:50px;
}

.card{
    width:450px;
    background-color:white;
    border-radius:15px;
    padding:15px;
    box-shadow:0px 0px 10px gray;
}

.card img{
    width:100%;
    border-radius:10px;
}

.card h2{
    margin-top:15px;
    font-size:30px;
}

.price{
    display:flex;
    align-items:center;
    gap:20px;
    margin-top:15px;
}

#newprice{
    color:blue;
    font-weight:bold;
    font-size:25px;
}

#oldprice{
    color:gray;
    font-size:25px;
}

.offer{
    background-color:lightgreen;
    border:none;
    padding:8px 15px;
    border-radius:8px;
    font-weight:bold;
}

hr{
    margin-top:15px;
}

</style>

</head>
<body>

<div class="container">

    <div class="card">

        <img src="https://public-files.gumroad.com/byicz81q1q3xw2wf6fzb7mptsm2k" alt="Course">

        <h2>Web Development Master Course @dot Batch</h2>

        <hr>

        <div class="price">

            <span id="newprice">₹4500</span>

            <span id="oldprice">
                <del>₹6999</del>
            </span>

            <button class="offer">
                42% Off
            </button>

        </div>

    </div>

</div>

</body>
</html>
